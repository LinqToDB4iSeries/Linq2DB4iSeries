on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
    - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Verify commit exists in origin/master
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/master
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build -c Release .\Source\ISeriesProvider\LinqToDB.DataProvider.DB2iSeries.csproj /p:ContinuousIntegrationBuild=true
    - name: Pack
      run: dotnet pack -c Release --include-symbols --include-source .\Source\ISeriesProvider\LinqToDB.DataProvider.DB2iSeries.csproj --no-build --output .
    - name: NuGet login
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: nsarris
    - name: Push
      run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
